version: "3.9"
services:
  vue-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

  vue-prod:
    container_name: vue-prod
    image: nginx:alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro # Monte le dist local en lecture seule
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy_net
    expose:
      - "80" # Expose le port interne sans le mapper directement sur l'hôte

networks:
  caddy_net:
    external: true
