version: "3.9"
services:
  vue-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

  vue-prod:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80" # Expose le port interne sans le mapper directement sur l'hôte

  caddy:
    image: caddy:latest
    container_name: caddy-prod
    depends_on:
      - vue-prod
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACME_AGREE=true
      - ACME_EMAIL=himapvoidzima@gmail.com
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
